---
modules-search: [ local ]

instances:
- id: cleanup
  module: shellprocess
  config: shellprocess-cleanup.conf
- id: initramfs
  module: shellprocess
  config: shellprocess-initramfs.conf
- id: klavye
  module: shellprocess
  config: shellprocess-klavye.conf
- id: canlikullanici
  module: shellprocess
  config: shellprocess-canlikullanici.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  # keyboard modulu duzeni yalnizca X11 conf'una yazar; Wayland'de Plasma
  # kxkbrc'yi okur. Bu adim ikisini eslestirir (bkz. shellprocess-klavye.conf).
  - shellprocess@klavye
  # unpackfs canli ISO'nun squashfs'ini kopyaladigi icin hedefte canli
  # kullanici "shala" tanimli gelir; users'tan ONCE silinmezse kullanici
  # ayni adi sectiginde "user shala already exists" hatasi olusur.
  - shellprocess@canlikullanici
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - shellprocess@cleanup
  - shellprocess@initramfs
  - services-systemd
  - bootloader
  - packages
  - umount
- show:
  - finished

branding: shalaos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
