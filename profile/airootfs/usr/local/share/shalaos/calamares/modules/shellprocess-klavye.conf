---
# Calamares'in "keyboard" modulu klavye duzenini yalnizca X11 yapilandirmasina
# yazar. ShalaOS'ta xorg-server yok (Plasma Wayland) — orada duzeni kxkbrc
# belirler. Bu adim, keyboard modulunun yazdigi duzeni okuyup kxkbrc'ye cevirir.
# Zincirde "keyboard"/"localecfg" adimlarindan SONRA calismalidir.
dontChroot: false
timeout: 60
script:
- /usr/local/bin/shalaos-klavye-kur
