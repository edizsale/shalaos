---
# Canli ortamin "shala" kullanicisini, users modulu calismadan ONCE hedef
# sistemden siler (hedef chroot icinde calisir).
#
# Neden gerekli:
#   unpackfs, canli ISO'nun squashfs'ini (airootfs.sfs) hedefe kopyalar. O
#   goruntudeki /etc/passwd icinde canli oturum kullanicisi "shala" tanimlidir
#   (uid 1000). Dolayisiyla users modulu calistiginda hedefte zaten bir "shala"
#   vardir; kullanici kurulumda ayni adi secerse useradd
#   "user shala already exists" ile basarisiz olur.
#
#   Silme islemi eskiden shellprocess@cleanup icindeydi, ama o adim users'tan
#   SONRA calisiyordu: hem cakismayi onleyemiyordu hem de kullanici adini
#   "shala" secmisse yeni olusturulan hesabi silme riski tasiyordu.
#
# Yan fayda: uid 1000 bosaldigi icin kurulan sistemdeki ilk kullanici 1001
# yerine 1000 alir.
#
# "-" oneki: kullanici yoksa hata kurulumu durdurmaz.
dontChroot: false
timeout: 60
script:
- "-userdel -rf shala"
