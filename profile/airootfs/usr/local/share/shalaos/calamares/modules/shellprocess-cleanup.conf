---
# Canli ortama ozgu her seyi KURULAN sistemden temizler (hedef chroot icinde calisir).
# "-" onekli komutlarin hatasi kurulumu durdurmaz.
dontChroot: false
timeout: 120
script:
- "-rm -f /etc/mkinitcpio.conf.d/archiso.conf"
- "-rm -f /etc/sddm.conf.d/autologin.conf"
- "-rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
- "-userdel -rf shala"
- "-sed -i '/# SHALAOS-EOS-BASLA/,/# SHALAOS-EOS-BITIR/d' /etc/pacman.conf"
- "-rm -f /etc/systemd/system/choose-mirror.service /etc/systemd/system/pacman-init.service /etc/systemd/system/etc-pacman.d-gnupg.mount /etc/systemd/system/livecd-alsa-unmuter.service /etc/systemd/system/livecd-talk.service"
- "-find /etc/systemd/system -xtype l -delete"
- "-rm -f /etc/motd /root/.automated_script.sh"
- "-rm -f /usr/share/applications/shalaos-kur.desktop"
- "-rm -f /etc/xdg/autostart/shalaos-kur-otomatik.desktop"
- "-rm -f /usr/local/bin/shalaos-kur /usr/local/bin/shalaos-kur-otomatik"
