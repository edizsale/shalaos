name: Hatırlatıcı — v1.0.3 tag'i

# 31 Temmuz 2026'da otomatik bir issue açar (kullanıcı isteği, 27 Tem 2026).
# Amaç: R6 çalışması bittiğinde v1.0.3 sürümünü etiketlemeyi unutmamak.
# Tek seferliktir — 2026 dışında hiçbir şey yapmaz. İşi bitince bu dosya silinebilir.

on:
  schedule:
    - cron: "12 7 31 7 *"   # 31 Temmuz 07:12 UTC ≈ 10:12 TR
  workflow_dispatch:         # elle test için

permissions:
  issues: write

jobs:
  hatirlat:
    runs-on: ubuntu-latest
    steps:
      - name: Yıl kontrolü (yalnızca 2026)
        id: yil
        run: |
          yil="$(date -u +%Y)"
          if [ "$yil" != "2026" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "gec=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$yil — bu hatırlatıcı yalnızca 2026 içindi, atlanıyor."
          else
            echo "gec=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Hatırlatma issue'su aç
        if: steps.yil.outputs.gec == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## ⏰ v1.0.3 sürümünü etiketleme zamanı',
              '',
              '27 Temmuz 2026\'da kurulan hatırlatıcı. Plan: **R6 — ShalaOS paket deposu**',
              'çalışmasını tamamlayıp `v1.0.3` etiketini atmak.',
              '',
              '📄 Tasarım belgesi: [`docs/R6-paket-deposu.md`](../blob/main/docs/R6-paket-deposu.md)',
              '',
              '### Etiketlemeden önce',
              '',
              '- [ ] R6 kapsamı bitti mi? (Belgedeki öneri: **v1.0.3 = depoyu yayına al**,',
              '      ISO\'yu henüz bağlama; ISO bağlama **v1.0.4**\'e kalsın — `pacman -Syu`',
              '      akışını bozma riski bu şekilde ikiye bölünüyor.)',
              '- [ ] `VERSION` → `1.0.3`',
              '- [ ] `CHANGELOG.md` → `[Yayımlanmadı]` içeriği `[1.0.3]` başlığına taşındı',
              '- [ ] `docs/surum-notlari.md` → sade dille yeni bölüm eklendi',
              '- [ ] Değişiklikler `main`\'e merge edildi',
              '',
              '### Etiketleme',
              '',
              '```bash',
              'cd ~/shalaos',
              'git pull origin main',
              'git tag -a v1.0.3 -m \'ShalaOS 1.0.3 "Dardania"\'',
              'git push origin v1.0.3',
              '```',
              '',
              'CI gerisini halleder: ISO üretimi → GPG imza → SourceForge → GitHub Release.',
              '',
              '---',
              '',
              '_Bu issue `.github/workflows/hatirlatici-v1.0.3.yml` tarafından otomatik açıldı._',
              '_Sürüm çıkınca hem bu issue hem o workflow dosyası kapatılıp silinebilir._',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⏰ Hatırlatma: v1.0.3 sürümünü etiketle (R6 paket deposu)',
              body,
            });
