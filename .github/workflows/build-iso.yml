name: ISO derle ve yayınla

# Tag (vX.Y.Z) atılınca ISO'yu üretir, SHA-256 + GPG imzası ekler ve GitHub
# Release oluşturur. workflow_dispatch ile etikete gerek olmadan elle de
# çalıştırılabilir (çıktı artefakt olarak yüklenir, release oluşturulmaz).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # commit tarihi (SOURCE_DATE_EPOCH) için

      - name: Disk alanı aç
        run: |
          # mkarchiso work dizini için runner'da yer aç.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Sürüm ve tarih bilgisini belirle
        id: meta
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            # elle çalıştırma: VERSION dosyasından oku
            # shellcheck disable=SC1091
            . ./VERSION
            VER="${SHALAOS_VERSION:-0.0.0}-dev"
          fi
          # kod adı VERSION dosyasından
          CODENAME="$(. ./VERSION; echo "${SHALAOS_CODENAME:-Dardania}")"
          EPOCH="$(git log -1 --format=%ct)"
          echo "version=$VER"        >> "$GITHUB_OUTPUT"
          echo "codename=$CODENAME"  >> "$GITHUB_OUTPUT"
          echo "epoch=$EPOCH"        >> "$GITHUB_OUTPUT"
          echo "iso=ShalaOS-${VER}-${CODENAME}-x86_64.iso" >> "$GITHUB_OUTPUT"
          echo "Sürüm: $VER  Kod adı: $CODENAME  Epoch: $EPOCH"

      - name: Derleyici imajını hazırla
        run: docker build -t shalaos-builder .

      - name: mkarchiso ile ISO üret
        env:
          SHALAOS_VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm --privileged \
            -e SHALAOS_VERSION -e SOURCE_DATE_EPOCH \
            -v "$PWD/profile:/build/profile:ro" \
            -v "$PWD/out:/build/out:rw" \
            -w /build shalaos-builder \
            bash -c 'mkarchiso -v -w /tmp/archiso-work -o /build/out /build/profile'

      - name: ISO'yu markalı isimle yeniden adlandır ve sağlama üret
        id: pack
        run: |
          set -euo pipefail
          src="$(find out -maxdepth 1 -name '*.iso' | head -n1)"
          [ -n "$src" ] || { echo "ISO bulunamadı!"; ls -la out; exit 1; }
          iso="out/${{ steps.meta.outputs.iso }}"
          mv "$src" "$iso"
          ( cd out && sha256sum "$(basename "$iso")" > "$(basename "$iso").sha256" )
          echo "iso_path=$iso" >> "$GITHUB_OUTPUT"
          ls -lh out

      - name: GPG imzası (secret varsa)
        id: sign
        env:
          GPG_KEY: ${{ secrets.SHALAOS_GPG_KEY }}
          GPG_PASSPHRASE: ${{ secrets.SHALAOS_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${GPG_KEY:-}" ]; then
            echo "::warning::SHALAOS_GPG_KEY tanımlı değil — ISO imzalanmadan yayımlanacak."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Secret base64 kodlanmış olarak saklanır (terminal kopyasında satır sonu
          # bozulmasını önlemek için) — çöz, sonra içe aktar.
          echo "$GPG_KEY" | base64 -d | gpg --batch --import
          iso="${{ steps.pack.outputs.iso_path }}"
          for f in "$iso" "$iso.sha256"; do
            gpg --batch --yes --pinentry-mode loopback \
                --passphrase "${GPG_PASSPHRASE:-}" \
                --detach-sign -o "$f.sig" "$f"
          done
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: SourceForge'a yükle (yalnızca tag'te)
        id: sfupload
        if: startsWith(github.ref, 'refs/tags/')
        env:
          SF_USER: ${{ secrets.SOURCEFORGE_USER }}
          SF_KEY_B64: ${{ secrets.SOURCEFORGE_SSH_KEY }}
          VER: ${{ steps.meta.outputs.version }}
          ISO: ${{ steps.meta.outputs.iso }}
        run: |
          set -euo pipefail
          if [ -z "${SF_USER:-}" ] || [ -z "${SF_KEY_B64:-}" ]; then
            echo "::error::SOURCEFORGE_USER / SOURCEFORGE_SSH_KEY secret'ları eksik."
            exit 1
          fi
          mkdir -p ~/.ssh
          # SSH özel anahtarı esnek: base64 kodluysa çöz, ham anahtarsa doğrudan yaz.
          if printf '%s' "$SF_KEY_B64" | grep -q 'PRIVATE KEY'; then
            printf '%s\n' "$SF_KEY_B64" > ~/.ssh/sf_key
          else
            # base64: kopyada sıkışmış olabilecek boşlukları at, sonra çöz.
            printf '%s' "$SF_KEY_B64" | tr -d '[:space:]' | base64 -d > ~/.ssh/sf_key
          fi
          chmod 600 ~/.ssh/sf_key
          # anahtar geçerli mi? erken, net hata ver.
          ssh-keygen -y -f ~/.ssh/sf_key >/dev/null \
            || { echo "::error::SOURCEFORGE_SSH_KEY geçersiz (ham anahtar ya da base64 olmalı)."; exit 1; }
          ssh-keyscan -H frs.sourceforge.net >> ~/.ssh/known_hosts 2>/dev/null
          DEST="$SF_USER@frs.sourceforge.net:/home/frs/project/shalaos/v$VER/"
          # ISO + sağlama + (varsa) imzalar
          files=(out/*.iso out/*.iso.sha256)
          for s in out/*.iso.sig out/*.iso.sha256.sig; do [ -e "$s" ] && files+=("$s"); done
          rsync -avP -e "ssh -i ~/.ssh/sf_key -o StrictHostKeyChecking=yes" "${files[@]}" "$DEST"
          rm -f ~/.ssh/sf_key
          echo "url=https://sourceforge.net/projects/shalaos/files/v$VER/$ISO/download" >> "$GITHUB_OUTPUT"

      - name: Artefaktları yükle (yalnızca elle test çalıştırmasında)
        if: ${{ always() && !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: shalaos-iso
          path: |
            out/*.iso
            out/*.sha256
            out/*.sig
          retention-days: 14

      - name: GitHub Release oluştur (yalnızca tag'te)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ShalaOS ${{ steps.meta.outputs.version }} "${{ steps.meta.outputs.codename }}"
          draft: false
          # ISO SourceForge'da; Release'e yalnızca sağlama + imza konur (2 GiB sınırı).
          files: |
            out/*.iso.sha256
            out/*.iso.sig
            out/*.iso.sha256.sig
          body: |
            ShalaOS ${{ steps.meta.outputs.version }} "${{ steps.meta.outputs.codename }}"

            Arch Linux tabanlı, KDE Plasma masaüstülü, koyu-kırmızı "dardania" temalı dağıtım.

            ## İndirme

            ISO, boyutu nedeniyle (GitHub'ın 2 GiB dosya sınırı) SourceForge'da barındırılıyor:

            👉 **[${{ steps.meta.outputs.iso }} indir](${{ steps.sfupload.outputs.url }})**

            Bu Release'e yalnızca sağlama (`.sha256`) ve imza (`.sig`) dosyaları eklenmiştir.

            ## Doğrulama (opsiyonel)
            ```bash
            sha256sum -c ${{ steps.meta.outputs.iso }}.sha256
            gpg --import KEYS
            gpg --verify ${{ steps.meta.outputs.iso }}.sig ${{ steps.meta.outputs.iso }}
            ```

            İmza durumu: `${{ steps.sign.outputs.signed }}`.

            Kurulum kılavuzu ve ayrıntılar için depo dokümantasyonuna bakın.
