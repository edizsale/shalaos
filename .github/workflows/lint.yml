name: Lint

# Kabuk betiklerini shellcheck ile denetler.

on:
  push:
    branches: ["**"]
    paths:
      - "**.sh"
      - "profile/profiledef.sh"
      - ".github/workflows/lint.yml"
  pull_request:
    paths:
      - "**.sh"
      - "profile/profiledef.sh"

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck kur
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Betikleri denetle
        run: |
          set -euo pipefail
          # profiledef.sh archiso tarafından source edilir; bağımsız denetim için
          # external-sources kapalı. Diğer betikler doğrudan denetlenir.
          shellcheck build.sh sync-dardania.sh
          shellcheck --shell=bash profile/profiledef.sh
